[package]
name    = "hace-soul-orch"
version = "0.1.0"
edition = "2021"
publish = false
description = "Soul Orchestrator — Multi-Soul State-Graph coordinator (Aura core)"

[dependencies]
hace-soul-base    = { path = "../base" }
hace-soul-profile = { path = "../profile" }
hace-soul-memory  = { path = "../memory" }
hace-soul-routing = { path = "../routing" }
hace-soul-hooks   = { path = "../hooks" }
hace-brain-base   = { path = "../../brain/base" }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
thiserror         = "1"
tokio             = { version = "1", features = ["rt", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["std"]
std     = []
